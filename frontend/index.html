    <style>
      /* Prevent white flash on page load - Aurora Night theme */
      html, body {
        margin: 0;
        padding: 0;
        background: #0a0e1a;
        color: #f1f5f9;
        font-family: 'Space Grotesk', system-ui, sans-serif;
      }

      @media print {
        body.printing-entry {
          background-color: white !important;
        }
        body.printing-entry > #root > div {
          visibility: hidden;
        }
        .printable {
          visibility: visible !important;
          position: absolute;
          left: 20px;
          top: 20px;
          right: 20px;
          box-shadow: none !important;
          border: 1px solid #ccc !important;
        }
        .printable * {
          visibility: visible !important;
        }
        .no-print {
          display: none !important;
        }
      }
    </style>
